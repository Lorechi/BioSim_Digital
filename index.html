<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ecosystem Simulation</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell">
    <button id="settingsButton" class="settings-button" type="button" aria-expanded="false" aria-controls="hudPanel">Settings</button>
    <section id="hudPanel" class="hud-panel">
      <div class="hud-row">
        <div class="spawner-instruction">
          <span>Please drag any of</span>
          <span class="instruction-spawners" aria-label="plant, herbivore, and carnivore spawners">
            <span class="instruction-spawner instruction-plant" aria-hidden="true"></span>
            <span class="instruction-spawner instruction-herbivore" aria-hidden="true"></span>
            <span class="instruction-spawner instruction-carnivore" aria-hidden="true"></span>
          </span>
          <span>from the left side of your screen into the darker area.</span>
        </div>
      </div>
      <div class="controls-row">
        <button id="fullscreenButton" type="button">Fullscreen</button>
        <label class="slider-group">
          <span>Speed</span>
          <input id="speedInput" type="range" min="0.25" max="3" value="2" step="0.25">
          <strong id="speedValue">2.00x</strong>
        </label>
        <label class="toggle">
          <input id="networkToggle" type="checkbox" checked>
          <span>Plant network</span>
        </label>
        <label class="toggle">
          <input id="catModeToggle" type="checkbox">
          <span>Cat mode</span>
        </label>
      </div>
    </section>
    <section class="arena-panel">
      <canvas id="simCanvas" aria-label="ecosystem simulation arena"></canvas>
    </section>
  </main>
  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
